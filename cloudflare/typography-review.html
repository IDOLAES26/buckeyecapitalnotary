 data-bcn-copy=\"small\">Appointment availability, document requirements,\u003cbr>and fees will be confirmed before your visit.\u003c/span>\u003c/span> \u003c/p>\u003c/article>\u003carticle data-bcn-id=\"e91\">\u003cb data-bcn-id=\"e92\">03\u003c/b>\u003ch3 data-bcn-id=\"e93\">Meet with confidence.\u003c/h3>\u003cp data-bcn-id=\"e94\">\u003cspan class=\"process-text-line\" data-bcn-id=\"e95\">\u003cspan data-bcn-copy=\"desktop\">Have your documents and identification ready.\u003cbr>Your notary will guide you through the notarization.\u003c/span>\u003cspan data-bcn-copy=\"tablet\">Have your documents and identification ready.\u003cbr>Your notary will guide you through the notarization.\u003c/span>\u003cspan data-bcn-copy=\"mobile\">Have your documents and identification ready.\u003cbr>Your notary will guide you through the notarization.\u003c/span>\u003cspan data-bcn-copy=\"small\">Have your documents and identification ready.\u003cbr>Your notary will guide you through the notarization.\u003c/span>\u003c/span> \u003c/p>\u003c/article>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"wrap prepare\" id=\"questions\" data-bcn-id=\"e97\">\u003cdiv data-bcn-id=\"e98\">\u003cdiv class=\"eyebrow\" data-bcn-id=\"e99\">Before we meet\u003c/div>\u003ch2 data-bcn-id=\"e100\">A little preparation.\u003cbr>A smoother appointment.\u003c/h2>\u003cul class=\"checklist\" data-bcn-id=\"e101\">\u003cli data-bcn-id=\"e102\">Have your complete document available.\u003c/li>\u003cli data-bcn-id=\"e103\">Have current photo identification ready for review.\u003c/li>\u003cli data-bcn-id=\"e104\">Confirm which signers need to attend.\u003c/li>\u003cli data-bcn-id=\"e105\">Discuss witness requirements before the appointment.\u003c/li>\u003cli data-bcn-id=\"e106\">Ask about signing instructions before signing in advance.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv class=\"faq-column\" data-bcn-id=\"e107\">\u003cdiv class=\"faq-scroll\" role=\"region\" aria-label=\"Common questions\" tabindex=\"0\" data-bcn-id=\"e108\">\u003cdiv class=\"eyebrow\" data-bcn-id=\"e109\">Common questions\u003c/div>\u003cdetails name=\"common-questions\" open=\"\" data-bcn-id=\"e110\">\u003csummary data-bcn-id=\"e111\">Where are mobile services available?\u003c/summary>\u003cp data-bcn-id=\"e112\">Mobile appointments are available in and around Columbus, Ohio.\u003c/p>\u003c/details>\u003cdetails name=\"common-questions\" id=\"meeting-locations-faq\" data-bcn-id=\"e113\">\u003csummary data-bcn-id=\"e114\">Where can we meet for a mobile notary appointment?\u003c/summary>\u003cdiv id=\"meeting-locations-answer\" data-bcn-id=\"e115\">\u003cp data-bcn-id=\"e116\">We meet at public, business, and facility locations in and around Columbus, Ohio. We do not meet at private residences.\u003c/p>\u003cul data-bcn-id=\"e117\">\u003cli data-bcn-id=\"e118\">Libraries\u003c/li>\u003cli data-bcn-id=\"e119\">Starbucks\u003c/li>\u003cli data-bcn-id=\"e120\">FedEx Office / Kinko\u2019s\u003c/li>\u003cli data-bcn-id=\"e121\">Post offices\u003c/li>\u003cli data-bcn-id=\"e122\">Hospitals\u003c/li>\u003cli data-bcn-id=\"e123\">Nursing homes\u003c/li>\u003cli data-bcn-id=\"e124\">Funeral homes\u003c/li>\u003cli data-bcn-id=\"e125\">Lawyers\u2019 offices\u003c/li>\u003cli data-bcn-id=\"e126\">Other suitable business locations\u003c/li>\u003c/ul>\u003cp data-bcn-id=\"e127\">All locations are subject to operating hours, suitable space, access or permission where needed, and confirmation before your appointment. Choose a listed location using the meeting-location search in the form. If your facility or office is missing, contact us to arrange the appointment.\u003c/p>\u003c/div>\u003c/details>\u003cdetails name=\"common-questions\" data-bcn-id=\"e128\">\u003csummary data-bcn-id=\"e129\">How much does an appointment cost?\u003c/summary>\u003cp data-bcn-id=\"e130\">Request a quote for your specific appointment. Notarization and any applicable travel charges will be explained before you confirm.\u003c/p>\u003c/details>\u003cdetails name=\"common-questions\" data-bcn-id=\"e131\">\u003csummary data-bcn-id=\"e132\">Can I schedule a virtual appointment now?\u003c/summary>\u003cp data-bcn-id=\"e133\">Virtual Notary is coming soon. You may prepare an inquiry for that service, but virtual appointments are not yet available.\u003c/p>\u003c/details>\u003cdetails name=\"common-questions\" data-bcn-id=\"e134\">\u003csummary data-bcn-id=\"e135\">Are estate planning and courier services available?\u003c/summary>\u003cp data-bcn-id=\"e136\">Both are coming soon. Their scope, availability, and booking details will be announced at launch.\u003c/p>\u003c/details>\u003cdetails name=\"common-questions\" data-bcn-id=\"e137\">\u003csummary data-bcn-id=\"e138\">Can a notary give me legal advice?\u003c/summary>\u003cp data-bcn-id=\"e139\">Notary services do not include legal advice. Direct questions about document selection, legal rights, or estate planning decisions to a licensed attorney.\u003c/p>\u003c/details>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"contact\" id=\"contact\" data-bcn-id=\"e140\">\u003cdiv class=\"wrap\" data-bcn-id=\"e141\">\u003cdiv class=\"appointment-intro\" data-bcn-id=\"e142\">\u003cdiv data-bcn-id=\"e143\">\u003cdiv class=\"eyebrow\" data-bcn-id=\"e144\">Let's take the next step\u003c/div>\u003ch2 data-bcn-id=\"e145\">Your documents.\u003cbr>Your schedule.\u003cbr>Our attention.\u003c/h2>\u003cp data-bcn-id=\"e146\">\u003cspan data-bcn-copy=\"desktop\">Start with a few details about your mobile appointment.\u003c/span>\u003cspan data-bcn-copy=\"tablet\">Start with a few details about\u003cbr>your mobile appointment.\u003c/span>\u003cspan data-bcn-copy=\"mobile\">Start with a few details about\u003cbr>your mobile appointment.\u003c/span>\u003cspan data-bcn-copy=\"small\">Start with a few details about\u003cbr>your mobile appointment.\u003c/span>\u003c/p>\u003c/div>\u003cdiv class=\"contact-note\" data-bcn-id=\"e147\">\u003cstrong data-bcn-id=\"e148\">Public, business &amp; facility appointments\u003c/strong>\u003cp data-bcn-id=\"e149\">We meet at public, business, and facility locations in and around Columbus, Ohio. We do not meet at private residences. \u003ca class=\"meeting-locations-link\" href=\"#meeting-locations-faq\" aria-haspopup=\"dialog\" data-bcn-id=\"e150\">Where can we meet?\u003c/a>\u003c/p>\u003ca class=\"service-link\" href=\"mailto:info@buckeyecapitalnotary.com\" data-bcn-id=\"e151\">info@buckeyecapitalnotary.com\u003c/a>\u003c/div>\u003c/div>\u003cdiv class=\"appointment-wizard\" data-bcn-id=\"e153\">\u003cdiv id=\"wizard-progress\" data-bcn-id=\"e154\">\u003cdiv class=\"wizard-progress-caption\" data-bcn-id=\"e155\">\u003cspan id=\"wizard-count\" data-bcn-id=\"e156\">\u003c/span>\u003cspan id=\"wizard-current\" data-bcn-id=\"e157\">\u003c/span>\u003c/div>\u003cdiv class=\"wizard-track\" id=\"wizard-meter\" role=\"progressbar\" aria-label=\"Appointment progress\" data-bcn-id=\"e158\">\u003cdiv id=\"wizard-fill\" data-bcn-id=\"e159\">\u003c/div>\u003c/div>\u003col id=\"wizard-steps\" data-bcn-id=\"e160\">\u003c/ol>\u003c/div>\u003cform id=\"inquiry\" action=\"https://formsubmit.co/info@buckeyecapitalnotary.com\" method=\"POST\" novalidate=\"\" data-bcn-id=\"e161\">\u003cinput type=\"hidden\" name=\"_subject\" value=\"New Buckeye Capital Notary appointment inquiry\" data-bcn-id=\"e162\">\u003cinput type=\"hidden\" name=\"_template\" value=\"table\" data-bcn-id=\"e163\">\u003csection class=\"wizard-page\" data-step=\"0\" data-bcn-id=\"e164\">\u003ch3 tabindex=\"-1\" data-bcn-id=\"e165\">First, a little about you.\u003c/h3>\u003cdiv class=\"form-grid\" data-bcn-id=\"e166\">\u003clabel data-bcn-id=\"e167\">\u003cspan data-bcn-id=\"e168\">\u003cspan class=\"required-mark\" aria-hidden=\"true\" data-bcn-id=\"e169\">*\u003c/span> First name\u003c/span>\u003cinput name=\"first_name\" autocomplete=\"given-name\" required=\"\" maxlength=\"100\" data-bcn-id=\"e170\">\u003c/label>\u003clabel data-bcn-id=\"e171\">\u003cspan data-bcn-id=\"e172\">\u003cspan class=\"required-mark\" aria-hidden=\"true\" data-bcn-id=\"e173\">*\u003c/span> Last name\u003c/span>\u003cinput name=\"last_name\" autocomplete=\"family-name\" required=\"\" maxlength=\"100\" data-bcn-id=\"e174\">\u003c/label>\u003clabel data-bcn-id=\"e175\">\u003cspan data-bcn-id=\"e176\">\u003cspan class=\"required-mark\" aria-hidden=\"true\" data-bcn-id=\"e177\">*\u003c/span> Phone number\u003c/span>\u003cinput name=\"phone\" type=\"tel\" autocomplete=\"tel\" required=\"\" maxlength=\"40\" data-bcn-id=\"e178\">\u003c/label>\u003clabel data-bcn-id=\"e179\">\u003cspan data-bcn-id=\"e180\">\u003cspan class=\"required-mark\" aria-hidden=\"true\" data-bcn-id=\"e181\">*\u003c/span> Email address\u003c/span>\u003cinput name=\"email\" type=\"email\" autocomplete=\"email\" required=\"\" maxlength=\"150\" data-bcn-id=\"e182\">\u003c/label>\u003c/div>\u003c/section>\u003csection class=\"wizard-page\" data-step=\"1\" data-bcn-id=\"e183\">\u003ch3 tabindex=\"-1\" data-bcn-id=\"e184\">Plan your appointment.\u003c/h3>\u003cdiv class=\"form-grid\" data-bcn-id=\"e185\">\u003clabel class=\"full\" data-bcn-id=\"e186\">Service\u003cselect name=\"service\" id=\"service\" data-bcn-id=\"e187\">\u003coption>Mobile Notary\u003c/option>\u003coption disabled=\"\">Virtual Notary \u2014 coming soon\u003c/option>\u003coption disabled=\"\">Estate Planning \u2014 coming soon\u003c/option>\u003coption disabled=\"\">Courier Services \u2014 coming soon\u003c/option>\u003c/select>\u003c/label>\u003clabel class=\"full\" data-bcn-id=\"e188\">\u003cspan id=\"document-type-label\" data-bcn-id=\"e189\">\u003cspan class=\"required-mark\" aria-hidden=\"true\" data-bcn-id=\"e190\">*\u003c/span> Document type\u003c/span>\u003cselect name=\"document_type\" id=\"document-type\" required=\"\" data-bcn-id=\"e191\">\u003coption value=\"\">Select the kind of document\u003c/option>\u003coption>Affidavit or sworn statement\u003c/option>\u003coption>Power of attorney\u003c/option>\u003coption>Vehicle title or bill of sale\u003c/option>\u003coption>Real estate or loan document\u003c/option>\u003coption>Estate planning document\u003c/option>\u003coption>Travel consent or parental consent\u003c/option>\u003coption>Business or financial document\u003c/option>\u003coption>School or employment form\u003c/option>\u003coption value=\"Other\">Other\u003c/option>\u003coption value=\"Not sure\">Not sure \u2014 describe the document\u003c/option>\u003c/select>\u003c/label>\u003clabel class=\"full\" id=\"document-description-field\" hidden=\"\" data-bcn-id=\"e192\">\u003cspan data-bcn-id=\"e193\">\u003cspan class=\"required-mark\" aria-hidden=\"true\" data-bcn-id=\"e194\">*\u003c/span> Document name or brief description\u003c/span>\u003cinput name=\"document_description\" id=\"document-description\" disabled=\"\" maxlength=\"200\" placeholder=\"Enter the document title or a brief general description\" data-bcn-id=\"e195\">\u003c/label>\u003cp class=\"full form-note\" data-bcn-id=\"e196\">Tell us the kind of document only. Please do not enter confidential details or identification numbers.\u003c/p>\u003clabel data-bcn-id=\"e197\">\u003cspan data-bcn-id=\"e198\">\u003cspan class=\"required-mark\" aria-hidden=\"true\" data-bcn-id=\"e199\">*\u003c/span> Preferred date\u003c/span>\u003cinput type=\"date\" name=\"date\" required=\"\" data-bcn-id=\"e200\">\u003c/label>\u003clabel data-bcn-id=\"e201\">\u003cspan data-bcn-id=\"e202\">\u003cspan class=\"required-mark\" aria-hidden=\"true\" data-bcn-id=\"e203\">*\u003c/span> Preferred time\u003c/span>\u003cinput type=\"time\" name=\"time\" required=\"\" aria-describedby=\"appointment-time-note\" data-bcn-id=\"e204\">\u003c/label>\u003cp class=\"full form-note\" id=\"appointment-time-note\" data-bcn-id=\"e205\">\u003cspan data-bcn-copy=\"desktop\">Choose your preferred appointment time in Columbus, Ohio local time (Eastern Time). Your appointment date and time will be confirmed after we review your request. Appointments requested within 24 hours are subject to availability.\u003c/span>\u003cspan data-bcn-copy=\"tablet\">Choose your preferred appointment time in Columbus, Ohio local time (Eastern Time). Your appointment date and time will be confirmed after we review your request. Appointments requested within 24 hours are subject to availability.\u003c/span>\u003cspan data-bcn-copy=\"mobile\">Choose your preferred appointment time in Columbus, Ohio local time (Eastern Time). Your appointment date and time will be confirmed after we review your request. Appointments requested within 24 hours are subject to availability.\u003c/span>\u003cspan data-bcn-copy=\"small\">Choose your preferred appointment time in Columbus, Ohio local time (Eastern Time). Your appointment date and time will be confirmed after\u003cbr>we review your request. Appointments requested within 24 hours are subject to availability.\u003c/span>\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"wizard-page\" data-step=\"2\" data-bcn-id=\"e206\">\u003ch3 tabindex=\"-1\" data-bcn-id=\"e207\">Choose where we\u2019ll meet.\u003c/h3>\u003cdiv class=\"form-grid\" data-bcn-id=\"e208\">\u003cdiv class=\"full location-finder\" data-bcn-id=\"e209\">\u003cdiv class=\"eyebrow\" data-bcn-id=\"e210\">\u003cspan data-bcn-copy=\"desktop\">Choose a convenient meeting location\u003c/span>\u003cspan data-bcn-copy=\"tablet\">Choose a convenient meeting location\u003c/span>\u003cspan data-bcn-copy=\"mobile\">Choose a convenient meeting location\u003c/span>\u003cspan data-bcn-copy=\"small\">CHOOSE A CONVENIENT\u003cbr>MEETING LOCATION\u003c/span>\u003c/div>\u003cdiv class=\"full address-search-row\" data-bcn-id=\"e211\">\u003clabel data-bcn-id=\"e212\">\u003cspan id=\"area-label\" data-bcn-id=\"e213\">\u003cspan class=\"required-mark\" aria-hidden=\"true\" data-bcn-id=\"e214\">*\u003c/span> Starting address or ZIP\u003c/span>\u003cinput required=\"\" name=\"area\" placeholder=\"Used to help choose a public meeting place\" maxlength=\"200\" data-bcn-id=\"e215\">\u003c/label>\u003cbutton class=\"button\" type=\"button\" id=\"find-meetings\" aria-controls=\"meeting-results\" data-bcn-id=\"e216\">Find nearby meeting places\u003c/button>\u003c/div>\u003cp data-bcn-id=\"e217\">Enter your starting address or ZIP, find nearby meeting places, and select a location from a category below. \u003ca class=\"meeting-locations-link\" href=\"#meeting-locations-faq\" aria-haspopup=\"dialog\" data-bcn-id=\"e218\">Where can we meet?\u003c/a>\u003c/p>\u003cp class=\"form-note\" data-bcn-id=\"e219\">By searching, you share the address or ZIP you entered with Geoapify to find nearby locations. A ZIP code is sufficient. Suggestions do not guarantee opening hours, seating, or permission to meet; we confirm the final location.\u003c/p>\u003cp id=\"meeting-status\" role=\"status\" aria-live=\"polite\" data-bcn-id=\"e220\">\u003c/p>\u003cdiv id=\"meeting-results\" data-bcn-id=\"e221\">\u003c/div>\u003cp id=\"selected-meeting\" role=\"status\" data-bcn-id=\"e222\">\u003c/p>\u003cinput type=\"hidden\" name=\"selected_place_id\" id=\"selected-place-id\" data-bcn-id=\"e223\">\u003cp class=\"location-attribution\" data-bcn-id=\"e224\">Powered by \u003ca href=\"https://www.geoapify.com/\" target=\"_blank\" rel=\"noopener\" data-bcn-id=\"e225\">Geoapify\u003c/a> \u00b7 \u00a9 \u003ca href=\"https://www.openstreetmap.org/copyright\" target=\"_blank\" rel=\"noopener\" data-bcn-id=\"e226\">OpenStreetMap contributors\u003c/a>\u003c/p>\u003c/div>\u003clabel class=\"full\" data-bcn-id=\"e227\">\u003cspan id=\"meeting-label\" data-bcn-id=\"e228\">\u003cspan class=\"required-mark\" aria-hidden=\"true\" data-bcn-id=\"e229\">*\u003c/span> Preferred meeting location\u003c/span>\u003cselect required=\"\" name=\"meeting_location\" id=\"meeting-location\" aria-describedby=\"meeting-selection-help\" data-bcn-id=\"e230\">\u003coption value=\"\">Select a location from the suggestions above\u003c/option>\u003c/select>\u003c/label>\u003cp class=\"full form-note\" id=\"meeting-selection-help\" data-bcn-id=\"e231\">A home address may be used as your starting point only. For Mobile Notary, select a listed public, business, or facility location above. \u003cspan style=\"text-decoration:underline;text-underline-offset:3px\" data-bcn-id=\"e232\">Residential meeting addresses are not accepted.\u003c/span> If your location is missing or search is unavailable, contact us at info@buckeyecapitalnotary.com to arrange an appointment.\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"wizard-page\" data-step=\"3\" data-bcn-id=\"e233\">\u003ch3 tabindex=\"-1\" data-bcn-id=\"e234\">See your estimated fee.\u003c/h3>\u003cdiv class=\"form-grid\" data-bcn-id=\"e235\">\u003cdiv class=\"full fee-estimator\" id=\"fee-estimator\" data-bcn-id=\"e236\">\u003cdiv class=\"eyebrow\" data-bcn-id=\"e237\">Your estimated fee\u003c/div>\u003clabel data-bcn-id=\"e238\">Number of notarial acts\u003cselect name=\"notarial_acts\" id=\"notarial-acts\" data-bcn-id=\"e239\">\u003coption value=\"\">Not sure \u2014 please confirm with me\u003c/option>\u003coption value=\"1\">1\u003c/option>\u003coption value=\"2\">2\u003c/option>\u003coption value=\"3\">3\u003c/option>\u003coption value=\"4\">4\u003c/option>\u003coption value=\"5\">5\u003c/option>\u003coption value=\"6\">6\u003c/option>\u003coption value=\"7\">7\u003c/option>\u003coption value=\"8\">8\u003c/option>\u003coption value=\"9\">9\u003c/option>\u003coption value=\"10\">10\u003c/option>\u003c/select>\u003c/label>\u003cp class=\"form-note\" data-bcn-id=\"e240\">Fees are $5 per notarial act, not per signature or page. If you are unsure how many acts your documents need, choose \u201cNot sure.\u201d Travel is estimated from our starting point to your selected meeting location using one-way driving distance.\u003c/p>\u003cbutton class=\"button\" type=\"button\" id=\"calculate-fees\" data-bcn-id=\"e241\">Calculate estimated fee\u003c/button>\u003cdiv id=\"fee-result\" role=\"status\" aria-live=\"polite\" data-bcn-id=\"e242\">\u003cp data-bcn-id=\"e243\">Select a meeting location above to calculate an estimate.\u003c/p>\u003c/div>\u003cp class=\"form-note\" data-bcn-id=\"e244\">The selected location is sent to our Cloudflare calculator and Geoapify for routing. Estimates do not confirm an appointment. Final fees, including travel, will be agreed before notarization.\u003c/p>\u003cinput type=\"hidden\" name=\"fee_estimate\" id=\"fee-estimate-value\" data-bcn-id=\"e245\">\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"wizard-page\" data-step=\"4\" data-bcn-id=\"e246\">\u003ch3 tabindex=\"-1\" data-bcn-id=\"e247\">Review your request.\u003c/h3>\u003cdiv class=\"form-grid\" data-bcn-id=\"e248\">\u003cdiv class=\"full\" id=\"appointment-review\" data-bcn-id=\"e249\">\u003c/div>\u003clabel class=\"full\" data-bcn-id=\"e250\">How can we help?\u003ctextarea name=\"message\" placeholder=\"General details only. Please do not include identification numbers or confidential document information.\" maxlength=\"2000\" data-bcn-id=\"e251\">\u003c/textarea>\u003c/label>\u003clabel class=\"full wizard-agreement\" data-bcn-id=\"e252\">\u003cinput type=\"checkbox\" name=\"request_acknowledgment\" required=\"\" value=\"Understood\" data-bcn-id=\"e253\">\u003cspan data-bcn-id=\"e254\">I understand this is an appointment request. Availability, location, and final fees will be confirmed before my appointment.\u003c/span>\u003c/label>\u003cdiv class=\"full\" data-bcn-id=\"e255\">\u003cbutton class=\"button\" type=\"submit\" data-bcn-id=\"e256\">Send appointment request \u2197\u003c/button>\u003cp class=\"form-note\" data-bcn-id=\"e257\">Requests are processed through FormSubmit and emailed to Buckeye Capital Notary. Submitting a request does not confirm an appointment. Please do not include confidential documents or identification numbers.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\u003cp id=\"wizard-error\" role=\"alert\" data-bcn-id=\"e258\">\u003c/p>\u003cdiv class=\"wizard-actions\" id=\"wizard-actions\" data-bcn-id=\"e259\">\u003cbutton class=\"button wizard-back\" type=\"button\" id=\"wizard-back\" data-bcn-id=\"e260\">\u2190 Back\u003c/button>\u003cbutton class=\"button\" type=\"button\" id=\"wizard-next\" data-bcn-id=\"e261\">Continue \u2192\u003c/button>\u003c/div>\u003c/form>\u003c/div>\u003c/div>\u003c/section>\u003c/main>\n\u003cfooter class=\"wrap\" data-bcn-id=\"e262\">\u003cdiv class=\"footer-grid\" data-bcn-id=\"e263\">\u003ca class=\"brand\" href=\"#\" data-bcn-id=\"e264\">\u003cspan class=\"mark\" aria-hidden=\"true\" data-bcn-id=\"e265\">\u003cspan data-bcn-copy=\"desktop\">BC\u003c/span>\u003cspan data-bcn-copy=\"tablet\">BCN\u003c/span>\u003cspan data-bcn-copy=\"mobile\">BC\u003c/span>\u003cspan data-bcn-copy=\"small\">BCN\u003c/span>\u003c/span>\u003cspan data-bcn-id=\"e266\">\u003cstrong data-bcn-id=\"e267\">BUCKEYE CAPITAL\u003c/strong>\u003cem data-bcn-id=\"e268\">Notary\u003c/em>\u003c/span>\u003c/a>\u003cp data-bcn-id=\"e269\">\u00a9 \u003cspan id=\"year\" data-bcn-id=\"e270\">\u003c/span> Buckeye Capital Notary. Columbus, Ohio.\u003cbr>Notary services do not include legal advice. Future services are subject to launch and confirmed availability.\u003c/p>\u003ca class=\"small\" href=\"#\" data-bcn-id=\"e271\">Back to top \u2191\u003c/a>\u003c/div>\u003c/footer>\n\u003cdialog id=\"meeting-locations-dialog\" aria-labelledby=\"meeting-dialog-title\" data-bcn-id=\"e272\">\u003cdiv class=\"meeting-dialog-header\" data-bcn-id=\"e273\">\u003ch2 id=\"meeting-dialog-title\" data-bcn-id=\"e274\">Where can we meet?\u003c/h2>\u003cbutton type=\"button\" id=\"close-meeting-dialog\" aria-label=\"Close meeting locations\" data-bcn-id=\"e275\">Close \u00d7\u003c/button>\u003c/div>\u003cdiv id=\"meeting-dialog-content\" data-bcn-id=\"e276\">\u003c/div>\u003c/dialog>\n\u003c/body>\u003c/html>\n"</script><script>
const source=JSON.parse(document.getElementById('source').textContent),preview=document.getElementById('preview'),scan=document.getElementById('scan');let measurements=[];function renderPreview(){preview.style.width=document.getElementById('width').value+'px';preview.srcdoc=source;}renderPreview();document.getElementById('width').onchange=renderPreview;document.getElementById('hero').onclick=()=>preview.contentWindow.scrollTo(0,0);document.getElementById('form').onclick=()=>preview.contentDocument.getElementById('contact').scrollIntoView();
async function check(){const widths=[...new Set([...Array.from({length:81},(_,i)=>320+20*i),350,351,559,560,700,701,768,800,801,1024,1025])].sort((a,b)=>a-b);for(const width of widths){scan.style.width=width+'px';await new Promise(resolve=>{scan.onload=resolve;scan.srcdoc=source;});await scan.contentDocument.fonts.ready;await new Promise(resolve=>requestAnimationFrame(resolve));const d=scan.contentDocument,w=scan.contentWindow;const overflow=[];for(const el of d.body.querySelectorAll('*')){if(['SCRIPT','STYLE','OPTION'].includes(el.tagName)||!el.getClientRects().length)continue;const r=el.getBoundingClientRect();if(r.width===0||r.height===0||w.getComputedStyle(el).visibility==='hidden')continue;if(r.left>=-1&&r.right<=width+1)continue;let clipped=false,p=el.parentElement;while(p&&p!==d.body){const style=w.getComputedStyle(p),box=p.getBoundingClientRect();if(['hidden','clip','auto','scroll'].includes(style.overflowX)&&box.left>=-1&&box.right<=width+1){clipped=true;break;}p=p.parentElement;}if(!clipped)overflow.push((el.id||el.getAttribute('data-bcn-id')||el.tagName)+': '+Math.round(r.left)+'..'+Math.round(r.right));}const row={width,pageWidth:d.documentElement.scrollWidth,h1:w.getComputedStyle(d.querySelector('h1')).fontSize,h2:w.getComputedStyle(d.querySelector('h2')).fontSize,overflow};measurements.push(row);const tr=document.createElement('tr');for(const value of [width,row.pageWidth,row.h1,row.h2,row.pageWidth>width||overflow.length?overflow.join('; ')||'Page exceeds viewport':'None']){const td=document.createElement('td');td.textContent=value;tr.append(td);}document.getElementById('results').append(tr);document.getElementById('summary').textContent='Checked '+measurements.length+' / '+widths.length+' widths';}const bad=measurements.filter(x=>x.pageWidth>x.width||x.overflow.length);document.getElementById('summary').textContent=measurements.length+' widths checked from 320px to 1920px. '+bad.length+' with horizontal overflow.';document.body.setAttribute('data-check-complete','true');}check().catch(e=>document.getElementById('summary').textContent=e.stack);
</script></body></html>
